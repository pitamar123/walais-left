<script>
// Same number for everyone: computed only from the date in Israel time (no server needed).
function israelDate(){
  var p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  return p; // YYYY-MM-DD
}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function deviceId(){
  try{var id=localStorage.getItem('wl_id');if(!id){id=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('wl_id',id)}return id}catch(e){return Math.random().toString(36).slice(2)}
}
var DID=deviceId();
// Different for each person/device, changes every day. 1..100, or 'INF' with a 1/50 chance.
function numberFor(day){var r=mulberry(hash(DID+'|'+day));r();r();if(r()<1/50)return 'INF';return 1+Math.floor(r()*100)}
function render(){
  var day=israelDate(), v=numberFor(day);
  var el=document.getElementById('n');
  if(v==='INF'){el.textContent='∞';el.style.color='#fff4b0';el.style.textShadow='0 0 40px #ffd400,0 0 80px #ffd400'}
  else{el.textContent=v;el.style.textShadow='';el.style.color='hsl('+(v*0.6)+',100%,'+(38+v*0.17)+'%)'} // 1 = red, 100 = yellow
  document.getElementById('d').textContent=day;
}
render();
setInterval(function(){if(document.getElementById('d').textContent!==israelDate())render()},30000);
</script></body></html>
