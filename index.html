<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0b0305;color:#fff;font-family:Impact,"Arial Black",Arial,sans-serif}
body{display:flex}
.wrap{width:min(100vw,560px);text-align:center;margin:auto;padding-bottom:24px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font:700 15px Arial,sans-serif;letter-spacing:.04em;color:#e9c9a0;background:#0b0305}
.bar span{white-space:nowrap}
.card{position:relative;container-type:inline-size;width:100%;aspect-ratio:1024/935;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;background:#222}
.card .l{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease;pointer-events:none}
.card .l.on{opacity:1}
#base{opacity:1}
.ttl{position:absolute;left:0;right:0;top:1%;font-size:8.6cqw;line-height:1;color:#f1e6c8;font-weight:900;text-shadow:0 0 2px #2a1d12,0 0 2px #2a1d12,0 0 3px #2a1d12,0 0 7px #2a1d12;opacity:0;transition:opacity .9s;pointer-events:none}
.ttl.on{opacity:1}
.num{position:absolute;left:0;right:0;width:fit-content;margin:0 auto;top:10%;font-size:min(20vw,112px);font-size:20cqw;line-height:1;font-weight:900;color:#f3ead4;
 text-shadow:0 0 3px #000,0 0 3px #000,0 0 10px #000,0 0 24px currentColor;pointer-events:none}
.num.hint{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
.num.rainbow{background:linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#0a84ff,#bf5af2);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 0 3px #000) drop-shadow(0 0 3px #000) drop-shadow(0 0 10px #fff)}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fx i{position:absolute;width:10px;height:14px;border-radius:2px}
.foot{margin-top:10px;font:13px Arial,sans-serif;color:#7a4a50}
.foot.tap{color:#c8766b;font-weight:700;letter-spacing:.06em}
.lb{display:none;margin:14px 12px 0;padding:12px;background:#140609;border:1px solid #3a1519;border-radius:10px;text-align:left;font:15px Arial,sans-serif;color:#e9c9a0}
.lb.show{display:block;animation:fadein .8s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lb h3{margin:0 0 8px;font:700 14px Arial,sans-serif;letter-spacing:.08em;text-align:center;color:#c8766b}
.lb .row{display:flex;gap:10px;padding:6px 8px;border-radius:6px}
.lb .row.me{background:#3a1519;color:#fff}
.lb .rk{width:32px}
.lb .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .sc{font-weight:700}
.lb .note{margin-top:8px;text-align:center;font-size:13px;color:#a07a70}
.ov{display:none;position:fixed;inset:0;z-index:10;background:rgba(5,1,2,.94);align-items:center;justify-content:center;padding:20px}
.ov .box{width:min(90vw,360px);text-align:center;font-family:Arial,sans-serif;color:#e9c9a0}
.ov h2{margin:0 0 6px;font:900 26px Impact,"Arial Black",Arial,sans-serif;color:#c8766b}
.ov p{margin:0 0 14px;font-size:14px;color:#a07a70}
.ov input{width:100%;box-sizing:border-box;padding:12px;font-size:18px;text-align:center;border-radius:8px;border:1px solid #5a2a2f;background:#1c0a0d;color:#fff}
.ov button{margin-top:12px;width:100%;padding:12px;font-size:17px;font-weight:700;border:0;border-radius:8px;background:#c8766b;color:#1a0508}
.card.noanim .l,.card.noanim .ttl{transition:none}
.lb:empty{display:none!important}
.pre .card,.pre .lb{visibility:hidden}
.ov input+input{margin-top:10px}
.ov button.ghost{background:transparent;color:#a07a70;font-size:14px;font-weight:400;margin-top:6px}
.ov .err{min-height:18px;margin-top:10px;font-size:13px;color:#e08a7a}
.foot a{color:#c8766b;text-decoration:underline;cursor:pointer}
.lb.still{animation:none}
</style></head><body>

<input id="cd" type="password" autocomplete="current-password" placeholder="Password">
<button id="lgok">ENTER</button>
<div class="err" id="lgerr"></div></div></div>
<script>
function $(i){return document.getElementById(i)}
var URL_='https://kovigaaepgesgjmqcyke.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvdmlnYWFlcGdlc2dqbXFjeWtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDE2ODQsImV4cCI6MjEwODc3NzY4NH0.FzeqiDSVE7NrV5QTdglGRn77spaBkBjzxFniqZ2NzCY';
function israelDate(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function numColor(v){return 'hsl('+(v*0.6)+',100%,'+(48+v*0.14)+'%)'} // 0 = red, 100 = yellow
function bestTxt(b){return b===null||b===undefined?'-':(b>100?'\u221E':String(b))}

// ---------- state ----------
var UID=null,curDay=null,curV=null,revealed=false,rolling=false,shownKey=null;
var bestPrev=null,bestNew=null,streakCount=1;

// ---------- password-only sign-in (the server checks the password) ----------
var PW=null;
function showLogin(msg){
  document.documentElement.classList.remove('pre');
  $('cd').value='';$('lgerr').textContent=msg||'';
  $('login').style.display='flex';
}
function callPlay(pw){
  return fetch(URL_+'/rest/v1/rpc/play',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({p_password:pw})});
}
function accept(data,pw){
  PW=pw;UID=data.id;
  lsSet('wl_cache',JSON.stringify({day:data.day,pw:pw,data:data}));
  $('whoe').textContent='Playing as '+data.name;$('who').style.display='';
  apply(data);
}
function doAuth(){
  var err=$('lgerr');err.textContent='';
  var pw=$('cd').value.trim();
  if(!pw){err.textContent='Enter your password.';return}
  $('lgok').disabled=true;
  callPlay(pw).then(function(r){
    if(r.status===401){err.textContent='Wrong password.';return}
    if(!r.ok){err.textContent='Something went wrong. Try again.';return}
    return r.json().then(function(data){lsSet('wl_pw',pw);$('login').style.display='none';accept(data,pw)});
  }).catch(function(){err.textContent='No connection. Try again.'}).then(function(){$('lgok').disabled=false});
}
$('lgok').onclick=doAuth;
$('cd').onkeydown=function(e){if(e.key==='Enter')doAuth()};
$('so').onclick=function(){
  lsDel('wl_pw');lsDel('wl_cache');PW=null;UID=null;shownKey=null;curV=null;
  resetCard();$('who').style.display='none';showLogin('');
};

// ---------- stats ----------
function showStats(){
  $('best').textContent='\uD83C\uDFC6 BEST: '+bestTxt(revealed?bestNew:bestPrev);
  $('streak').textContent='\uD83D\uDD25 '+streakCount+(streakCount===1?' day':' days');
}

// ---------- card: hidden until tapped ----------
function resetCard(){
  revealed=false;rolling=false;
  ['red','gold','white'].forEach(function(i){$(i).classList.remove('on')});
  $('ttl').classList.remove('on');
  var n=$('n');n.className='num hint';n.style.color='';n.textContent='?';
  $('fx').textContent='';
  $('lb').classList.remove('show','still');$('inf').classList.remove('show','still');
  var d=$('d');d.className='foot tap';d.textContent='TAP THE PICTURE';
}
function burst(){
  var fx=$('fx'),W=fx.clientWidth,H=fx.clientHeight,cols=['#ff3b30','#ff9500','#ffd60a','#34c759','#0a84ff','#bf5af2','#ff2d95'];
  for(var i=0;i<36;i++){
    var p=document.createElement('i');p.style.background=cols[i%cols.length];
    p.style.left=(W/2)+'px';p.style.top=(H*0.2)+'px';fx.appendChild(p);
    var a=Math.random()*Math.PI*2,s=80+Math.random()*(W*0.5);
    var dx=Math.cos(a)*s,dy=Math.sin(a)*s-60;
    var an=p.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+(dy+H*0.5)+'px) rotate('+(Math.random()*720)+'deg)',opacity:0}],{duration:1200+Math.random()*900,easing:'cubic-bezier(.2,.8,.3,1)'});
    an.onfinish=(function(el){return function(){el.remove()}})(p);
  }
}
function showFinal(v,day,animate){
  var n=$('n'),inf=(v==='INF');
  n.classList.remove('hint');
  if(inf){n.textContent='\u221E';n.classList.add('rainbow');n.style.color=''}
  else{n.textContent=v;n.style.color=numColor(v)}
  $(inf?'white':(v>50?'gold':'red')).classList.add('on');
  if(inf)$('ttl').classList.add('on');
  revealed=true;rolling=false;
  var d=$('d');d.className='foot';d.textContent=day;
  if(!animate){$('lb').classList.add('still');$('inf').classList.add('still')}
  $('lb').classList.add('show');$('inf').classList.add('show');
  showStats();
  if(animate){
    if(n.animate)n.animate([{transform:'scale(.4)'},{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:600,easing:'cubic-bezier(.3,1.6,.5,1)'});
    if(inf)burst();
  }
}
function reveal(){
  if(curV===null){if(!shownKey)start();return}
  if(revealed||rolling)return;
  rolling=true;
  lsSet('wl_rev',curDay+'|'+UID); // the animation plays only once per day
  var card=$('card'),n=$('n'),v=curV,day=curDay;
  n.classList.remove('hint');
  if(card.animate)card.animate([{transform:'translateX(0)'},{transform:'translateX(-9px) rotate(-.6deg)'},{transform:'translateX(9px) rotate(.6deg)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:450});
  var step=0,total=18;
  (function tick(){
    step++;
    if(step<total){
      var r=Math.floor(Math.random()*101);
      n.textContent=r;n.style.color=numColor(r);
      setTimeout(tick,50+step*step*0.35);
    }else showFinal(v,day,true);
  })();
}
$('card').addEventListener('click',reveal);

// ---------- leaderboard (reads are public) ----------
var PL=URL_+'/rest/v1/plays';
function sbFetch(q,o){o=o||{};var hd={apikey:KEY,Authorization:'Bearer '+KEY};for(var k in (o.headers||{}))hd[k]=o.headers[k];o.headers=hd;return fetch(PL+q,o)}
function scoreTxt(s){return s>100?'\u221E':String(s)}
function countOf(r){return parseInt((r.headers.get('content-range')||'').split('/')[1],10)||0}
function loadBoard(day){
  return sbFetch('?day=eq.'+day+'&select=name,score,user_id&order=score.desc,created_at.asc&limit=10',{headers:{Prefer:'count=exact'}})
  .then(function(r){if(!r.ok)throw 0;var total=countOf(r);return r.json().then(function(rows){return{rows:rows,total:total}})})
  .then(function(d){
    draw(d.rows,d.total,null);
    var mineIn=d.rows.some(function(x){return x.user_id===UID});
    if(!mineIn){return myRank(day).then(function(rk){if(rk)draw(d.rows,d.total,rk)})}
  }).catch(function(){var b=$('lb');b.textContent='';var n=document.createElement('div');n.className='note';n.textContent='Leaderboard unavailable (no connection)';b.appendChild(n)});
}
function myRank(day){
  return sbFetch('?day=eq.'+day+'&user_id=eq.'+UID+'&select=score,created_at').then(function(r){return r.json()}).then(function(a){
    if(!a||!a[0])return null;var s=a[0].score,t=a[0].created_at;
    var f='(score.gt.'+s+',and(score.eq.'+s+',created_at.lt.'+t+'))';
    return sbFetch('?day=eq.'+day+'&select=score&limit=1&or='+encodeURIComponent(f),{headers:{Prefer:'count=exact'}}).then(function(r){return countOf(r)+1});
  }).catch(function(){return null});
}
function loadInf(day){
  return sbFetch('?score=eq.101&select=name,day,user_id&order=day.desc,created_at.asc&limit=1000',{headers:{Prefer:'count=exact'}})
  .then(function(r){if(!r.ok)throw 0;var total=countOf(r);return r.json().then(function(rows){return{rows:rows,total:total}})})
  .then(function(d){drawInf(d.rows,d.total,day)}).catch(function(){$('inf').textContent=''});
}
function drawInf(rows,total,day){
  var b=$('inf');b.textContent='';
  var h=document.createElement('h3');h.textContent='\u221E CLUB';b.appendChild(h);
  var today=rows.filter(function(x){return x.day===day});
  var s=document.createElement('div');s.className='note';s.style.margin='0 0 6px';
  s.textContent=today.length?('Got \u221E today: '+today.length):'Nobody got \u221E today yet';b.appendChild(s);
  today.slice(0,10).forEach(function(x){
    var r=document.createElement('div');r.className='row'+(x.user_id===UID?' me':'');
    var a=document.createElement('span');a.className='rk';a.textContent='\u221E';
    var n=document.createElement('span');n.className='nm';n.textContent=x.name;
    r.appendChild(a);r.appendChild(n);b.appendChild(r);
  });
  if(today.length>10){var m=document.createElement('div');m.className='note';m.style.margin='4px 0 0';m.textContent='+'+(today.length-10)+' more';b.appendChild(m)}
  var ppl={};rows.forEach(function(x){ppl[x.user_id]=1});
  var np=Object.keys(ppl).length;
  var all=document.createElement('div');all.className='note';
  all.textContent='All time: '+total+(total===1?' \u221E':' \u221E\u2019s')+' by '+np+(np===1?' person':' people');
  b.appendChild(all);
}
function draw(rows,total,rk){
  var b=$('lb');b.textContent='';
  var h=document.createElement('h3');h.textContent='TODAY\u2019S TOP 10';b.appendChild(h);
  var medals=['\uD83E\uDD47','\uD83E\uDD48','\uD83E\uDD49'];
  rows.forEach(function(x,i){
    var r=document.createElement('div');r.className='row'+(x.user_id===UID?' me':'');
    var a=document.createElement('span');a.className='rk';a.textContent=i<3?medals[i]:(i+1)+'.';
    var n=document.createElement('span');n.className='nm';n.textContent=x.name;
    var s=document.createElement('span');s.className='sc';s.textContent=scoreTxt(x.score);
    r.appendChild(a);r.appendChild(n);r.appendChild(s);b.appendChild(r);
  });
  var note=document.createElement('div');note.className='note';
  note.textContent=rk?('You\u2019re #'+rk+' of '+total):(total+(total===1?' player':' players')+' today');
  b.appendChild(note);
}

// ---------- today's number comes from the server (one per account per day) ----------
function apply(data){
  var v=data.score>100?'INF':data.score,key=data.day+'|'+UID;
  curDay=data.day;curV=v;bestPrev=data.best_prev;bestNew=data.best;streakCount=data.streak||1;
  if(shownKey!==key){
    shownKey=key;
    var done=(lsGet('wl_rev')===key);
    resetCard();
    if(done){revealed=true;var c=$('card');c.classList.add('noanim');showFinal(v,data.day,false);setTimeout(function(){c.classList.remove('noanim')},80)}
    else showStats();
    loadInf(data.day);
  }else showStats();
  loadBoard(data.day);
  document.documentElement.classList.remove('pre');
}
function fetchPlay(){
  return callPlay(PW).then(function(r){
    if(r.status===401){
      lsDel('wl_pw');lsDel('wl_cache');PW=null;UID=null;shownKey=null;curV=null;
      resetCard();$('who').style.display='none';showLogin('That password no longer works.');return;
    }
    if(!r.ok)throw 0;
    return r.json().then(function(data){accept(data,PW)});
  }).catch(function(){
    if(curV===null){
      document.documentElement.classList.remove('pre');
      var d=$('d');d.className='foot tap';d.textContent='NO CONNECTION \u2014 TAP TO RETRY';
    }
  });
}
function start(){
  PW=lsGet('wl_pw');
  if(!PW){showLogin('');return}
  var day=israelDate(),cache=null;
  try{cache=JSON.parse(lsGet('wl_cache'))}catch(e){}
  if(cache&&cache.day===day&&cache.pw===PW&&cache.data){
    UID=cache.data.id;$('whoe').textContent='Playing as '+cache.data.name;$('who').style.display='';
    apply(cache.data);
  }else{curV=null;shownKey=null;var d=$('d');d.className='foot';d.textContent='LOADING\u2026'}
  fetchPlay();
}
setInterval(function(){if(curDay&&UID&&curDay!==israelDate()){shownKey=null;curV=null;start()}else if(curDay&&UID&&curV!==null)loadBoard(curDay)},60000);
document.addEventListener('visibilitychange',function(){if(document.hidden||!PW)return;if($('login').style.display==='flex')return;if(curDay&&curDay!==israelDate()){shownKey=null;curV=null}start()});
start();
</script></body></html>
