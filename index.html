<script>
function israelDate(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function deviceId(){
  try{var id=localStorage.getItem('wl_id');if(!id){id=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('wl_id',id)}return id}catch(e){return Math.random().toString(36).slice(2)}
}
var DID=deviceId();
// Different for each person/device, changes every day. 0..100, or 'INF' with a 1/50 chance.
function numberFor(day){var r=mulberry(hash(DID+'|'+day));r();r();if(r()<1/50)return 'INF';return Math.floor(r()*101)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function prevDay(day){var p=day.split('-');var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
function rank(v){return v==='INF'?Infinity:Number(v)}
function updateStats(day,v){
  // streak: consecutive days the app was opened (Israel date)
  var st=null;try{st=JSON.parse(lsGet('wl_streak'))}catch(e){}
  var count=1;
  if(st&&st.last===day){count=st.count||1}
  else if(st&&st.last===prevDay(day)){count=(st.count||0)+1}
  lsSet('wl_streak',JSON.stringify({last:day,count:count}));
  // best: highest number ever got
  var best=lsGet('wl_best');
  if(best===null||rank(v)>rank(best)){best=String(v);lsSet('wl_best',best)}
  document.getElementById('best').textContent='\ud83c\udfc6 BEST: '+(best==='INF'?'\u221E':best);
  document.getElementById('streak').textContent='\ud83d\udd25 '+count+(count===1?' day':' days');
}
function render(){
  var day=israelDate(), v=numberFor(day);
  var el=document.getElementById('n');
  if(v==='INF'){el.textContent='\u221E';el.style.color='#fff4b0'}
  else{el.textContent=v;el.style.color='hsl('+(v*0.6)+',100%,'+(48+v*0.14)+'%)'} // 0 = red, 100 = yellow
  var gold=(v==='INF'||v>50);
  document.getElementById('red').className=gold?'':'on';
  document.getElementById('gold').className=gold?'on':'';
  document.getElementById('d').textContent=day;
  updateStats(day,v);
}
render();
setInterval(function(){if(document.getElementById('d').textContent!==israelDate())render()},30000);
</script></body></html>
